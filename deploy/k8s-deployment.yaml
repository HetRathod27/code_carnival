apiVersion: apps/v1
kind: Deployment
metadata:
  name: queueless-api
  namespace: queueless
  labels:
    app: queueless-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: queueless-api
  template:
    metadata:
      labels:
        app: queueless-api
    spec:
      containers:
        - name: api
          image: queueless-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: AUTH_PROVIDER
              value: "supabase"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: queueless-secrets
                  key: database-url
            - name: SUPABASE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: queueless-secrets
                  key: supabase-jwt-secret
            - name: INTERNAL_TICK_SECRET
              valueFrom:
                secretKeyRef:
                  name: queueless-secrets
                  key: internal-tick-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: queueless-api-svc
  namespace: queueless
spec:
  type: ClusterIP
  selector:
    app: queueless-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
